[project]
name = "flight-delay-prediction"
version = "0.1.0"
description = "Local development foundation for real-time flight delay prediction."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.35,<2",
    "cassandra-driver>=3.29.2,<4",
    "fastapi>=0.115,<1",
    "kafka-python>=2.0.2,<3",
    "mlflow>=2.19,<3",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pyarrow>=12,<16",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyspark==3.5.5",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
orchestration = [
    "apache-airflow>=2.10.4,<3",
    "apache-airflow-providers-apache-spark>=5,<6",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_delay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
